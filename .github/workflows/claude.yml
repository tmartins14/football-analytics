name: claude

# Runs Claude Code on this repo. Owner only, on the owner's own issues and PRs.
# Triggers: label `agent-ok` on an issue, or `@claude` in a comment.
# Never runs for outside contributors. This repo is public.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.actor == 'tmartins14' && (
        (github.event_name == 'issues' && github.event.label.name == 'agent-ok' && github.event.issue.user.login == 'tmartins14') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.issue.user.login == 'tmartins14') ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.pull_request.user.login == 'tmartins14')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # The Stop hooks run uv and npm, so the runner needs both.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: agent-ok
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Bash(bash scripts/check_docs.sh),Bash(bash scripts/check_tests.sh),Bash(uv run pytest:*),Bash(uv run ruff:*)"
